<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>简历编辑器 - Resume Editor</title>
    <link rel="stylesheet" href="./css/editor.css">
    <link rel="stylesheet" href="./css/editor-popup.css">
    <link rel="stylesheet" href="./css/templates/simplicity.css" id="template-style">
</head>
<body>
    <div class="app-container">
        <!-- 顶部工具栏 -->
        <header class="toolbar">
            <div class="toolbar-left">
                <div class="logo">
                    <span class="logo-icon">📝</span>
                    <span class="logo-text">简历编辑器</span>
                </div>
            </div>
            <div class="toolbar-center">
                <!-- 模板选择器 -->
                <div class="template-selector">
                    <button class="template-btn active" data-template="simplicity" onclick="switchTemplate('simplicity')">
                        <img src="https://api.resume.lgdsunday.club/download/imgs/simplicity.png" alt="简约">
                        <span>简约</span>
                    </button>
                    <button class="template-btn" data-template="standard" onclick="switchTemplate('standard')">
                        <img src="https://api.resume.lgdsunday.club/download/imgs/standard.png" alt="标准">
                        <span>标准</span>
                    </button>
                    <button class="template-btn" data-template="classic" onclick="switchTemplate('classic')">
                        <img src="https://api.resume.lgdsunday.club/download/imgs/classic.png" alt="经典">
                        <span>经典</span>
                    </button>
                    <button class="template-btn" data-template="creative" onclick="switchTemplate('creative')">
                        <img src="https://api.resume.lgdsunday.club/download/imgs/creative.png" alt="创意">
                        <span>创意</span>
                    </button>
                    <button class="template-btn" data-template="academic" onclick="switchTemplate('academic')">
                        <img src="https://api.resume.lgdsunday.club/download/imgs/academic.png" alt="学术">
                        <span>学术</span>
                    </button>
                </div>
            </div>
            <div class="toolbar-right">
                <button class="btn btn-outline" id="btn-import" title="导入数据">
                    <span class="btn-icon">📥</span>
                    <span class="btn-text">导入</span>
                </button>
                <button class="btn btn-outline" id="btn-export-json" title="导出JSON">
                    <span class="btn-icon">📤</span>
                    <span class="btn-text">导出</span>
                </button>
                <button class="btn btn-primary" id="btn-export-pdf">
                    <span class="btn-icon">📄</span>
                    <span class="btn-text">导出PDF</span>
                </button>
            </div>
        </header>

        <!-- 主内容区域 -->
        <main class="main-content">
            <!-- 预览容器 -->
            <div class="preview-wrapper">
                <div class="preview-container" id="preview-container">
                    <div class="a4-page" id="resume-preview">
                        <div id="resume">
                            <!-- 个人信息区域 -->
                            <div class="resume-mode__info" id="section-info" data-mkey="base">
                                <div class="info-header">
                                    <div class="avatar-wrapper" id="preview-avatar" style="display:none">
                                        <img src="" alt="头像" id="preview-avatar-img">
                                    </div>
                                    <div class="info-content">
                                        <h1 class="info-name" id="preview-name">你的姓名</h1>
                                        <p class="info-title" id="preview-title"></p>
                                        <div class="info-contact" id="preview-contact"></div>
                                    </div>
                                </div>
                            </div>

                            <!-- 求职意向 -->
                            <div class="resume-section" id="section-job" data-mkey="job" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>求职意向</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-job" class="resume-mode"></div>
                            </div>

                            <!-- 教育背景 -->
                            <div class="resume-section" id="section-education" data-mkey="education" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>教育背景</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-education"></div>
                            </div>

                            <!-- 工作经验 -->
                            <div class="resume-section" id="section-work" data-mkey="work" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>工作经验</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-work"></div>
                            </div>

                            <!-- 校园经历 -->
                            <div class="resume-section" id="section-campus" data-mkey="campus" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>校园经历</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-campus"></div>
                            </div>

                            <!-- 技能特长 -->
                            <div class="resume-section" id="section-skill" data-mkey="skill" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>技能特长</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-skill" class="resume-mode"></div>
                            </div>

                            <!-- 荣誉证书 -->
                            <div class="resume-section" id="section-certificate" data-mkey="certificate" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>荣誉证书</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-certificate" class="resume-mode"></div>
                            </div>

                            <!-- 自我评价 -->
                            <div class="resume-section" id="section-selfEvaluation" data-mkey="selfEvaluation" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>自我评价</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-selfEvaluation" class="resume-mode"></div>
                            </div>

                            <!-- 项目经历 -->
                            <div class="resume-section" id="section-project" data-mkey="project" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>项目经历</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-project"></div>
                            </div>

                            <!-- 实习经历 -->
                            <div class="resume-section" id="section-internship" data-mkey="internship" style="display:none">
                                <div class="resume-mode__title">
                                    <div class="module_tit">
                                        <span>实习经历</span>
                                        <div class="tit_icon"><i></i></div>
                                        <dfn></dfn>
                                    </div>
                                </div>
                                <div id="preview-internship"></div>
                            </div>

                            <!-- 空状态提示 -->
                            <div class="empty-state" id="empty-state">
                                <div class="empty-icon">📝</div>
                                <p>开始编辑你的简历吧</p>
                                <p class="hint">点击下方编辑按钮开始编辑</p>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 页数状态 -->
                <div class="page-status" id="page-status">
                    <span class="status-ok">✅ 内容适配单页</span>
                </div>
            </div>
        </main>

        <!-- 底部编辑栏 - 逆向自原站 -->
        <footer class="bottom-toolbar" id="bottom-toolbar">
            <div class="toolbar-toggle" id="toolbar-toggle">
                <span class="toggle-icon">▲</span>
            </div>
            <div class="toolbar-content">
                <div class="toolbar-tabs" id="toolbar-tabs">
                    <!-- 动态生成标签 -->
                </div>
                <div class="toolbar-actions">
                    <div class="spacing-control">
                        <label>间距设置</label>
                        <div class="slider-group">
                            <span>字体</span>
                            <input type="range" id="font-size" min="12" max="16" value="14" title="字体大小">
                            <span id="font-size-value">14</span>
                        </div>
                        <div class="slider-group">
                            <span>行距</span>
                            <input type="range" id="line-spacing" min="8" max="20" value="12" title="行间距">
                            <span id="line-spacing-value">12</span>
                        </div>
                        <div class="slider-group">
                            <span>模块</span>
                            <input type="range" id="module-spacing" min="12" max="32" value="20" title="模块间距">
                            <span id="module-spacing-value">20</span>
                        </div>
                    </div>
                    <div class="action-buttons">
                        <button type="button" class="btn btn-auto-fit" id="btn-auto-fit">
                            📄 自动调整为1页
                        </button>
                        <button type="button" class="btn btn-reset" id="btn-reset-spacing">
                            🔄 重置间距
                        </button>
                    </div>
                </div>
            </div>
        </footer>
    </div>

    <!-- 编辑弹窗 -->
    <div class="editor-popup" id="editor-popup">
        <div class="popup-header">
            <div class="popup-tabs" id="popup-tabs"></div>
            <button type="button" class="popup-close" id="popup-close">✕</button>
        </div>
        <div class="popup-content" id="popup-content"></div>
    </div>

    <!-- 隐藏的文件输入 -->
    <input type="file" id="import-input" accept=".json" style="display:none">

    <!-- 加载 html2pdf.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <!-- 加载本地模块 -->
    <script src="./js/store.js"></script>
    <script src="./js/icons.js"></script>
    <script src="./js/storage.js"></script>
    <script src="./js/auto-pagination.js"></script>
    <script src="./js/pdf-export.js"></script>
    <script src="./js/editor-popup.js"></script>
    <script src="./js/app.js"></script>
</body>
</html>
